name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: building_test
          POSTGRES_USER: building
          POSTGRES_PASSWORD: building
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U building -d building_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://building:building@localhost:5432/building_test
      APP_ENV: test
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e './apps/api[dev]'
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U building -d building_test >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" && exit 1
      - name: Run alembic migrations (with retries)
        run: |
          for i in {1..3}; do
            cd apps/api && alembic upgrade head && alembic downgrade base && alembic upgrade head && break || sleep 5
          done
      - name: Audit statically declared test skips
        run: python scripts/audit_test_skips.py --strict
      - name: Run PostgreSQL/PostGIS integration tests
        run: cd apps/api && pytest -q -m postgres -rs
      - name: Run application tests with SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: cd apps/api && ruff check . && pytest -q -m 'not postgres' -rs
      - name: Build API Docker image
        run: docker build -t ai-architect-api ./apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci --no-audit --no-fund
      - run: node scripts/agent-runtime.mjs --help && node --test scripts/agent-runtime.test.mjs
      - run: cd apps/web && npm run lint && npm test && npm run build
      - name: Build Web Docker image
        run: docker build -t ai-architect-web ./apps/web
  docker-compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready (including database connectivity)"
          docker compose ps
          docker compose logs --no-color api db
          exit 1
      - name: Smoke test API
        run: curl -sf http://localhost:8000/api/v1/system | grep -q '\"decision_provider\"'
      - name: Tear down
        run: docker compose down
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API and browser-test dependencies
        run: |
          pip install -e './apps/api[dev]'
          cd apps/web && npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run full product browser acceptance
        run: cd apps/web && npm run test:e2e -- e2e/phase1-navigation-acceptance.spec.ts e2e/phase28-release-acceptance.spec.ts e2e/phase29-site-workspace.spec.ts e2e/phase30-s16-acceptance.spec.ts e2e/phase2-identity-acceptance.spec.ts
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile CAD and runtime entrypoint scripts
        run: python -m py_compile scripts/check_cad_toolchain_manifest.py scripts/cad_toolchain_smoke.py scripts/run_regeneration_worker.py scripts/s16_release_gate.py
      - name: Enforce reviewed CAD/BIM license policy
        run: python scripts/check_cad_toolchain_manifest.py
      - name: Enforce requirements accuracy benchmark
        run: python scripts/benchmark_requirements.py --min-f1 0.95 --min-precision 0.95 --min-recall 0.95
      - name: Enforce S16 product release gate
        run: python scripts/s16_release_gate.py
      - run: python scripts/release_preflight.py

  opencode-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRCHITECT_OPENCODE_PASSWORD: ci-only-opencode-runtime-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned OpenCode CLI
        run: npm install --global --no-audit --no-fund opencode-ai@1.19.4
      - name: Start the managed OpenCode runtime
        run: |
          node scripts/agent-runtime.mjs start --port 4096 --origin http://localhost:5173 > "$RUNNER_TEMP/opencode-runtime.json"
      - name: Verify OpenCode health, provider discovery and MCP registration
        run: |
          node --input-type=module <<'NODE'
          const password = process.env.AIRCHITECT_OPENCODE_PASSWORD;
          const authorization = `Basic ${Buffer.from(`opencode:${password}`).toString('base64')}`;
          const baseUrl = 'http://127.0.0.1:4096';
          const headers = { Authorization: authorization, 'Content-Type': 'application/json' };
          const health = await fetch(`${baseUrl}/global/health`, { headers });
          if (!health.ok || (await health.json()).healthy !== true) throw new Error('OpenCode health check failed');
          const providers = await fetch(`${baseUrl}/provider`, { headers });
          const catalog = await providers.json();
          if (!providers.ok || !Array.isArray(catalog.all) || !Array.isArray(catalog.connected)) throw new Error('OpenCode provider discovery contract failed');
          const mcp = await fetch(`${baseUrl}/mcp`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              name: 'airchitect',
              config: {
                type: 'remote',
                url: 'http://127.0.0.1:1/mcp',
                oauth: false,
                enabled: false,
                headers: { Authorization: 'Bearer ci-invalid-token' },
              },
            }),
          });
          if (!mcp.ok) throw new Error(`OpenCode MCP registration failed (${mcp.status})`);
          process.stdout.write('OpenCode runtime, provider discovery and MCP registration passed.\\n');
          NODE
      - name: Stop the managed OpenCode runtime
        if: always()
        run: node scripts/agent-runtime.mjs stop
