name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: building_test
          POSTGRES_USER: building
          POSTGRES_PASSWORD: building
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U building -d building_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://building:building@localhost:5432/building_test
      APP_ENV: test
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e './apps/api[dev]'
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U building -d building_test >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" && exit 1
      - name: Run alembic migrations (with retries)
        run: |
          for i in {1..3}; do
            cd apps/api && alembic upgrade head && alembic downgrade base && alembic upgrade head && break || sleep 5
          done
      - name: Run tests with SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: cd apps/api && ruff check . && pytest -q
      - name: Build API Docker image
        run: docker build -t ai-architect-api ./apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci --no-audit --no-fund
      - run: cd apps/web && npm run lint && npm test && npm run build
      - name: Build Web Docker image
        run: docker build -t ai-architect-web ./apps/web
  docker-compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" && exit 1
      - name: Smoke test API
        run: curl -sf http://localhost:8000/api/v1/projects | grep -q '"projects"'
      - name: Tear down
        run: docker compose down
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/release_preflight.py
