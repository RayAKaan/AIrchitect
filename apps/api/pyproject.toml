[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "building-feasibility-api"
version = "0.2.0"
description = "Versioned building feasibility orchestration API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.34.3",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.41",
  "asyncpg==0.30.0",
  "alembic==1.16.2",
  "email-validator==2.2.0",
  "reportlab==4.4.2"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "httpx==0.28.1",
  "ruff==0.12.0",
  "mypy==1.16.1",
  "aiosqlite==0.21.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Legacy prototype modules use compact statements; enforce correctness rules while they are incrementally reformatted.
ignore = ["E401", "E402", "E701", "E702", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# The CAD worker executes in a dedicated virtualenv that owns the native CAD/BIM
# stack (OCP/OCCT, IfcOpenShell, FreeCAD). The API environment deliberately does
# not contain those packages -- that separation is the security boundary for
# this phase, not a missing dependency -- so mypy run from the API environment
# cannot resolve them. Silence only the imports, never the checking.
module = [
    "OCP.*",
    "ifcopenshell.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# freecad_script.py is executed by FreeCAD's embedded interpreter. It shares no
# code with the API, imports FreeCAD's own modules, and is deliberately kept free
# of annotations so it can run standalone. mypy cannot see FreeCAD's runtime
# types at all, so checking it produces noise rather than confidence.
module = "app.cad_worker.freecad_script"
ignore_errors = true
