services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-building}
      POSTGRES_USER: ${POSTGRES_USER:-building}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-building}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://building:building@db:5432/building}
      APP_ENV: ${APP_ENV:-local}
      AUTH_SECRET: ${AUTH_SECRET:-local-only-change-this-secret}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-deterministic}
      GEOMETRY_ENGINE: ${GEOMETRY_ENGINE:-cad_bim}
      CAD_ALLOW_LEGACY_ENGINE: ${CAD_ALLOW_LEGACY_ENGINE:-true}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./apps/web
      target: runner
    ports: ["80:80"]
    depends_on: [api]
  web-dev:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm ci && npm run dev"
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on: [api]
    profiles: ["dev"]
volumes:
  postgres_data:
