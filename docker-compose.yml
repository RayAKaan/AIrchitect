services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: building
      POSTGRES_USER: building
      POSTGRES_PASSWORD: building
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U building -d building"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://building:building@db:5432/building
      APP_ENV: local
      DECISION_PROVIDER: deterministic
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm ci && npm run dev"
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on: [api]
volumes:
  postgres_data:
